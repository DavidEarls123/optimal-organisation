# Push to main -> the installed app picks the change up next time it opens.
#
# Only JavaScript and assets travel this way. Anything native — a new Expo
# module, a permission, a change to app.json's plugins — needs a fresh build
# instead, because the binary on the phone has to change.
name: Publish update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Update branch to publish to
        default: production
        type: string

jobs:
  publish:
    name: Publish to the app
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check it still holds together
        run: |
          npm run typecheck
          npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the update
        run: eas update --branch ${{ inputs.branch || 'production' }} --message "${{ github.event.head_commit.message || 'manual publish' }}"
