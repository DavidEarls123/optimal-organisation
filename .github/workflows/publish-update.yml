# Push to main -> the installed app picks the change up next time it opens.
#
# Publishes to the `preview` channel, because that is what `eas build --profile
# preview` listens on, and that is the build installed on the phone. If you ever
# move to a TestFlight or App Store build, that one listens on `production` —
# change the default below to match, or the updates will go nowhere visible.
#
# Only JavaScript and assets travel this way. Anything native — a new Expo
# module, a permission, a change to app.json's plugins — needs a fresh build
# instead, because the binary on the phone has to change.
name: Publish update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Update channel to publish to
        default: preview
        type: string

jobs:
  publish:
    name: Publish to the app
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check it still holds together
        run: |
          npm run typecheck
          npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The commit message goes in through the environment, never interpolated
      # into the command. A message containing a quote, a newline or a > would
      # otherwise be run as shell — which is both a bug and an injection hole.
      - name: Publish the update
        env:
          UPDATE_BRANCH: ${{ inputs.branch || 'preview' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual publish' }}
        run: |
          MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-140)
          [ -n "$MESSAGE" ] || MESSAGE="update"
          echo "Publishing to $UPDATE_BRANCH: $MESSAGE"
          eas update --branch "$UPDATE_BRANCH" --platform ios --message "$MESSAGE"
