# Rebuild the app from GitHub, so you never need a terminal for it.
#
# Use this when a change is native rather than JavaScript — a new Expo module,
# a permission, anything touching app.json's plugins. Ordinary changes do not
# need it; those go out through publish-update.yml on every push to main.
#
# Actions tab -> Build app -> Run workflow.
#
# The first build has to be run locally (`eas build --platform ios --profile
# preview`), because Apple sign-in and certificate creation are interactive.
# Once EAS holds the credentials, every build after that can run from here.
name: Build app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        default: preview
        type: choice
        options: [preview, production]
      platform:
        description: Platform
        default: ios
        type: choice
        options: [ios, android, all]

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check it still holds together
        run: |
          npm run typecheck
          npm test

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Where to find it
        run: echo "Build queued. It appears at https://expo.dev/accounts -> your project -> Builds, and Expo emails you the install link when it finishes."
